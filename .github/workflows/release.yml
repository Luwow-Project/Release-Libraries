name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The libraries' release version, such as v0.1.0"
        required: true
      release_version:
        description: "The Luwow release they're built for, such as v2026.10.31 (default: CMakeLists.txt's RELEASE_VERSION)"
        required: false

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version }}
  GH_TOKEN: ${{ github.token }}

jobs:
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release_version: ${{ steps.release.outputs.release_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate the version
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The version must look like v0.2.0, got $VERSION"
            exit 1
          fi

      - name: Pick the Luwow release
        id: release
        run: |
          version="${{ inputs.release_version }}"
          if [ -z "$version" ]; then
            version="$(sed -n 's/^set(RELEASE_VERSION "\([^"]*\)".*/\1/p' CMakeLists.txt)"
          fi
          gh release view "$version" --repo Luwow-Project/Release > /dev/null
          echo "Built for Luwow $version"
          echo "release_version=$version" >> "$GITHUB_OUTPUT"

      - name: Find or create the release
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$VERSION is already released, its archives are replaced"
          else
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$VERSION" --generate-notes --draft \
              --notes "For Luwow ${{ steps.release.outputs.release_version }}: extract next to its executables."
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix: # not using ubuntu-latest to improve compatibility
        os: [{name: linux-x64, version: ubuntu-22.04}, {name: macos-arm64, version: macos-latest}, {name: windows-x64, version: windows-latest}]
    name: ${{ matrix.os.name }}
    runs-on: ${{ matrix.os.version }}
    env:
      RELEASE_VERSION: ${{ needs.create-release.outputs.release_version }}
    defaults:
      run:
        shell: bash

    steps:
      # Every library's source, with the types
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Installing curl for Linux, net.request's client.
      - name: Install libcurl
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev pkg-config
          pkg-config --exists --print-errors libcurl
          echo "libcurl $(pkg-config --modversion libcurl)"

      - name: Configure
        run: cmake -S . -B build -D CMAKE_BUILD_TYPE=Release -D "RELEASE_VERSION=$RELEASE_VERSION"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # Nothing is uploaded that fails the tests, run with the release's own executables
      - name: Test
        run: |
          gh release download "$RELEASE_VERSION" --repo Luwow-Project/Release \
            --pattern "luwow-${RELEASE_VERSION}-${{ matrix.os.name }}.zip" --output release.zip
          mkdir release-bin
          (cd release-bin && unzip -q ../release.zip)
          python tests/run_tests.py --bin release-bin

      - name: Install
        run: |
          cmake --install build --config Release --prefix dist --component libraries
          ls -R dist/libraries dist/types

      - name: Pack
        run: |
          name="luwow-libraries-${VERSION}-${{ matrix.os.name }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd dist && 7z a -tzip "../${name}.zip" libraries types > /dev/null)
          else
            (cd dist && zip -qry "../${name}.zip" libraries types)
          fi
          ls -l "${name}.zip"

      - name: Upload
        run: gh release upload "$VERSION" luwow-libraries-*.zip --repo "$GITHUB_REPOSITORY" --clobber
